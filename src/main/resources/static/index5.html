<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hoàn thành thử thách</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #b9b4ab;
            height: 100vh;
            overflow: hidden;
        }

        .game {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* BACKGROUND IMAGE */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* KHUNG CLICK */
        .click-box {
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            width: 380px;
            height: 50px;
            cursor: pointer;
        }

    </style>
</head>

<body>

<div class="game">

    <!-- BACKGROUND -->
    <img src="background5.png" class="background" alt="Bánh đang cắp quà">

    <!-- KHUNG CLICK -->
    <a href="https://forms.gle/TkXKudVji7iEDns3A" target="_blank" class="click-box" aria-label="Điền form nhận điểm"></a>

</div>

</body>
</html>
